{% extends "base.html" %}

{% block title %}Tasks - Admin - Life Organiser{% endblock %}

{% block content %}
<section class="admin-tasks" x-data="{ filterType: '{{ filter_type or '' }}' }">
    <div class="page-header">
        <h2>Tasks</h2>
        <a href="/admin/tasks/new" class="btn-submit">+ New Task</a>
    </div>

    <div class="filters">
        <div class="form-group">
            <label for="filter-type">Filter by Type</label>
            <select id="filter-type" x-model="filterType" @change="window.location.href = filterType ? `/admin/tasks?type=${filterType}` : '/admin/tasks'">
                <option value="">All Types</option>
                <option value="appointment">Appointment</option>
                <option value="deadline">Deadline</option>
                <option value="recurring">Recurring</option>
                <option value="variable_recurring">Variable Recurring</option>
                <option value="errand">Errand</option>
                <option value="workout">Workout</option>
            </select>
        </div>
    </div>

    <div
        class="task-list"
        id="task-list"
        hx-get="/admin/tasks{% if filter_type %}?type={{ filter_type }}{% endif %}"
        hx-trigger="taskUpdated from:body"
        hx-swap="innerHTML"
    >
        {% include "admin/_task_rows.html" %}
    </div>
</section>

<style>
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}

.filters {
    margin-bottom: 1.5rem;
}

.filters .form-group {
    max-width: 200px;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.task-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    padding: 1rem 1.25rem;
    border-radius: 8px;
}

.task-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.task-type-badge {
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    background: var(--bg-secondary);
    text-transform: uppercase;
}

.task-type-appointment { background: var(--accent); }
.task-type-deadline { background: var(--warning); color: var(--bg-primary); }
.task-type-recurring { background: var(--success); color: var(--bg-primary); }
.task-type-variable_recurring { background: #9b59b6; }
.task-type-errand { background: var(--text-secondary); color: var(--bg-primary); }
.task-type-workout { background: #3498db; }

.task-title {
    font-weight: 500;
}

.task-duration {
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.task-row-actions {
    display: flex;
    gap: 0.5rem;
}

.btn-edit {
    padding: 0.375rem 0.75rem;
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.875rem;
    transition: background 0.2s;
}

.btn-edit:hover {
    background: var(--accent);
    color: white;
}

.task-row-actions .btn-done,
.task-row-actions .btn-defer {
    padding: 0.375rem 0.75rem;
    border-radius: 6px;
    background: transparent;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
}

.task-row-actions .btn-done {
    border: 1px solid var(--success);
    color: var(--success);
}

.task-row-actions .btn-done:hover {
    background: var(--success);
    color: var(--text-on-accent);
}

.task-row-actions .btn-defer {
    border: 1px solid var(--text-secondary);
    color: var(--text-secondary);
}

.task-row-actions .btn-defer:hover {
    border-color: var(--warning);
    color: var(--warning);
}
</style>
{% endblock %}
