<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Life Organiser{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
    <header>
        <h1>Life Organiser</h1>
        <nav>
            <a href="/">Tasks</a>
            <a href="/tasks/timeline">Timeline</a>
            <a href="/tasks/week">Week</a>
            <a href="/workouts/today">Workout</a>
            <a href="/admin">Admin</a>
        </nav>
        <button class="notify-toggle" id="notify-toggle" title="Enable notifications" aria-label="Enable notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </button>
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
        </button>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
        document.body.addEventListener('htmx:afterSwap', () => lucide.createIcons());
    </script>
    <script>
        function showUndoToast(logIds, label) {
            document.getElementById('undo-toast')?.remove();
            clearTimeout(window._undoTimer);

            if (!Array.isArray(logIds)) logIds = [logIds];

            const toast = document.createElement('div');
            toast.id = 'undo-toast';

            const labelEl = document.createElement('span');
            labelEl.className = 'undo-toast-label';
            labelEl.textContent = label;

            const undoBtn = document.createElement('button');
            undoBtn.className = 'undo-toast-btn';
            undoBtn.textContent = 'Undo';
            const undoUrl = logIds.length === 1 ? '/undo/' + logIds[0] : '/undo/batch/' + logIds.join(',');
            undoBtn.setAttribute('hx-post', undoUrl);
            undoBtn.setAttribute('hx-swap', 'none');

            const closeBtn = document.createElement('button');
            closeBtn.className = 'undo-toast-close';
            closeBtn.textContent = '×';
            closeBtn.addEventListener('click', function() {
                toast.remove();
                clearTimeout(window._undoTimer);
            });

            toast.appendChild(labelEl);
            toast.appendChild(undoBtn);
            toast.appendChild(closeBtn);
            document.body.appendChild(toast);
            htmx.process(toast);

            undoBtn.addEventListener('htmx:afterRequest', function() {
                toast.remove();
                clearTimeout(window._undoTimer);
                htmx.trigger(document.body, 'taskUpdated');
            });

            window._undoTimer = setTimeout(function() {
                toast.remove();
            }, 15000);
        }

        function handleUndoHeader(xhr) {
            try {
                var h = xhr && xhr.getResponseHeader('HX-Trigger');
                if (!h) return;
                var t = JSON.parse(h);
                if (t.showUndo) showUndoToast(t.showUndo.ids, t.showUndo.label);
            } catch(e) {}
        }

        // Fallback for modal-based completions (variable/workout) that can't use hx-on
        document.body.addEventListener('showUndo', function(evt) {
            showUndoToast(evt.detail.ids, evt.detail.label);
        });
    </script>
</body>
</html>
