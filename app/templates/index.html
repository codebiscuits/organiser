{% extends "base.html" %}

{% block content %}
<div class="focus-layout">
    <section class="current-task-focus">
        <div id="current-task-card" hx-get="/tasks/current" hx-trigger="load, taskUpdated from:body" hx-swap="innerHTML">
            <p class="loading">Loading...</p>
        </div>
    </section>

    <section class="upcoming-tasks">
        <h2 class="upcoming-header">Up Next</h2>
        <div id="task-list" class="task-stack" hx-get="/tasks/upcoming" hx-trigger="load, taskUpdated from:body" hx-swap="innerHTML">
            <p class="loading">Loading tasks...</p>
        </div>
    </section>
</div>

<button 
    class="add-task-btn"
    hx-get="/tasks/new"
    hx-target="#modal-container"
    hx-swap="innerHTML"
>
    +
</button>

<div id="modal-container"></div>
{% endblock %}
