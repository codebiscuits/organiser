<div class="modal-overlay" x-data="{
    submitting: false,
    selectedDays: [],
    allowedDays: [],
    selectedTagIds: [],
    notificationRows: [],
    presets: [],
    selectedPresetId: '',
    presetName: '',
    showPresetSave: false,
    form: {
        type: '',
        title: '',
        notes: '',
        estimated_duration: null,
        importance: 2,
        urgency: 2,
        allow_afternoon: false,
        deadline_at: null,
        scheduled_at: null,
        prep_duration: null,
        scheduled_time: null,
        location: '',
        recurrence: {
            interval_type: 'daily',
            interval_multiple: 7,
            day_of_week: null,
            day_of_month: null,
            month_of_year: null,
            start_date: null,
            end_date: null
        }
    },
    applyPreset(id) {
        if (!id) return;
        const p = this.presets.find(x => x.id == id);
        if (!p) return;
        this.form.type = p.type || '';
        this.form.title = p.title || '';
        this.form.notes = p.notes || '';
        this.form.estimated_duration = p.estimated_duration;
        this.form.importance = p.importance || 2;
        this.form.urgency = p.urgency || 2;
        this.form.allow_afternoon = p.allow_afternoon || false;
        this.form.deadline_at = p.deadline_at;
        this.form.scheduled_at = p.scheduled_at;
        this.form.prep_duration = p.prep_duration;
        this.form.scheduled_time = p.scheduled_time;
        this.form.location = p.location || '';
        this.form.recurrence.interval_type = p.interval_type || 'daily';
        this.form.recurrence.interval_multiple = p.interval_multiple || 7;
        this.form.recurrence.day_of_week = p.day_of_week;
        this.form.recurrence.day_of_month = p.day_of_month;
        this.form.recurrence.month_of_year = p.month_of_year;
        this.selectedDays = p.day_of_week ? p.day_of_week.split(',') : [];
        this.allowedDays = p.allowed_days ? p.allowed_days.split(',') : [];
    },
    async saveAsPreset() {
        if (!this.presetName.trim()) return;
        const payload = {
            name: this.presetName.trim(),
            type: this.form.type,
            title: this.form.title || null,
            notes: this.form.notes || null,
            estimated_duration: this.form.estimated_duration,
            importance: this.form.importance,
            urgency: this.form.urgency,
            allow_afternoon: this.form.allow_afternoon,
            prep_duration: this.form.prep_duration,
            scheduled_time: this.form.scheduled_time || null,
            location: this.form.location || null,
            interval_type: this.form.type === 'variable_recurring' ? 'daily' : (this.form.recurrence.interval_type || null),
            interval_multiple: this.form.recurrence.interval_multiple || null,
            day_of_week: this.selectedDays.length > 0 ? this.selectedDays.sort().join(',') : null,
            day_of_month: this.form.recurrence.day_of_month || null,
            month_of_year: this.form.recurrence.month_of_year || null,
            allowed_days: this.allowedDays.length > 0 ? this.allowedDays.sort().join(',') : null,
        };
        try {
            const resp = await fetch('/presets/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (resp.ok) {
                const saved = await resp.json();
                this.presets.push(saved);
                this.selectedPresetId = String(saved.id);
                this.showPresetSave = false;
                this.presetName = '';
            } else {
                const error = await resp.json();
                alert('Error saving preset: ' + (error.detail || 'Unknown error'));
            }
        } catch (err) {
            alert('Error saving preset: ' + err.message);
        }
    },
    showUrgency() {
        return ['errand', 'recurring', 'variable_recurring', 'workout'].includes(this.form.type);
    },
    showAllowAfternoon() {
        return ['errand', 'recurring', 'variable_recurring', 'workout'].includes(this.form.type);
    },
    addNotificationRow() {
        this.notificationRows.push({ mode: 'at', minutes: 15 });
    },
    removeNotificationRow(index) {
        this.notificationRows.splice(index, 1);
    },
    closeModal() {
        document.getElementById('modal-container').innerHTML = '';
    },
    async submitForm() {
        this.submitting = true;
        const payload = {
            type: this.form.type,
            title: this.form.title,
            notes: this.form.notes || null,
            estimated_duration: this.form.estimated_duration,
            importance: this.form.importance,
            allow_afternoon: this.form.allow_afternoon,
            tag_ids: this.selectedTagIds.map(Number)
        };
        if (this.showUrgency()) {
            payload.urgency = this.form.urgency;
        }
        if (this.form.type === 'appointment') {
            payload.scheduled_at = this.form.scheduled_at;
            payload.prep_duration = this.form.prep_duration;
            payload.location = this.form.location || null;
            payload.notification_offsets = this.notificationRows.map(
                r => r.mode === 'at' ? 0 : Math.max(0, r.minutes || 0)
            );
        }
        if (this.form.type === 'deadline') {
            payload.deadline_at = this.form.deadline_at;
        }
        if (this.form.type === 'recurring' || this.form.type === 'workout') {
            payload.recurrence = {
                interval_type: this.form.recurrence.interval_type,
                interval_multiple: this.form.recurrence.interval_multiple || 1
            };
            if (this.form.recurrence.interval_type === 'weekly' && this.selectedDays.length > 0) {
                payload.recurrence.day_of_week = this.selectedDays.sort().join(',');
            }
            if (this.form.recurrence.interval_type === 'monthly' && this.form.recurrence.day_of_month) {
                payload.recurrence.day_of_month = this.form.recurrence.day_of_month;
            }
            if (this.form.recurrence.interval_type === 'yearly' && this.form.recurrence.month_of_year) {
                payload.recurrence.month_of_year = this.form.recurrence.month_of_year;
            }
            if (this.form.recurrence.start_date) {
                payload.recurrence.start_date = this.form.recurrence.start_date + 'T00:00:00';
            }
            if (this.form.recurrence.end_date) {
                payload.recurrence.end_date = this.form.recurrence.end_date + 'T00:00:00';
            }
            if (this.form.scheduled_time) {
                payload.scheduled_time = this.form.scheduled_time;
            }
        }
        if (this.form.type === 'variable_recurring') {
            payload.recurrence = {
                interval_type: 'daily',
                interval_multiple: this.form.recurrence.interval_multiple || 7,
            };
            if (this.form.recurrence.start_date) {
                payload.recurrence.start_date = this.form.recurrence.start_date + 'T00:00:00';
            }
            if (this.selectedPresetId) {
                payload.preset_id = parseInt(this.selectedPresetId);
            }
            if (this.allowedDays.length > 0) {
                payload.allowed_days = this.allowedDays.sort().join(',');
            }
        }
        try {
            const response = await fetch('/tasks/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                this.closeModal();
                htmx.trigger(document.body, 'taskUpdated');
            } else {
                const error = await response.json();
                alert('Error creating task: ' + (error.detail || 'Unknown error'));
            }
        } catch (err) {
            alert('Error creating task: ' + err.message);
        } finally {
            this.submitting = false;
        }
    }
}" x-init="fetch('/presets/').then(r => r.json()).then(d => presets = d).catch(() => {})" @click.self="closeModal()">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Task</h2>
            <button class="modal-close" @click="closeModal()">&times;</button>
        </div>

        <form @submit.prevent="submitForm()" class="task-form">
            <!-- Preset Dropdown -->
            <div class="form-group">
                <label for="preset">Load from Preset</label>
                <select id="preset" x-model="selectedPresetId" @change="applyPreset(selectedPresetId)">
                    <option value="">-- No preset --</option>
                    <template x-for="p in presets" :key="p.id">
                        <option :value="p.id" x-text="p.name"></option>
                    </template>
                </select>
            </div>

            {% set useFormNames = false %}
            {% include "components/_task_form_fields.html" %}

            <!-- Save as Preset -->
            <div class="form-group" x-show="form.type">
                <div x-show="!showPresetSave">
                    <button type="button" class="btn-secondary" @click="showPresetSave = true">Save as Preset</button>
                </div>
                <div x-show="showPresetSave" class="preset-save-row">
                    <input type="text" x-model="presetName" placeholder="Preset name..." class="preset-name-input">
                    <button type="button" class="btn-primary" @click="saveAsPreset()" :disabled="!presetName.trim()">Save</button>
                    <button type="button" class="btn-secondary" @click="showPresetSave = false; presetName = ''">Cancel</button>
                </div>
            </div>

            <!-- Submit -->
            <div class="form-actions">
                <button type="button" class="btn-cancel" @click="closeModal()">Cancel</button>
                <button type="submit" class="btn-submit" :disabled="submitting">
                    <span x-show="!submitting">Create Task</span>
                    <span x-show="submitting">Creating...</span>
                </button>
            </div>
        </form>
    </div>
</div>
