<div class="modal-overlay" id="variable-complete-modal">
    <div class="modal-content">
        <h2>When next?</h2>
        <p class="modal-task-title">{{ task.title }}</p>
        <form
            hx-post="/tasks/{{ task.id }}/complete/variable"
            hx-swap="none"
            hx-on::after-request="this.closest('.modal-overlay').remove()"
        >
            <div class="form-group">
                <label for="days_until_next">Days until next occurrence</label>
                <input type="number" id="days_until_next" name="days_until_next" min="1" value="7" required autofocus>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Done</button>
                <button type="button" class="btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            </div>
        </form>
    </div>
</div>
