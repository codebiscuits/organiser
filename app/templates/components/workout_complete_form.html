<div class="modal-overlay" id="workout-modal">
    <div class="modal-content">
        <h2>Log Workout</h2>
        {% if all_exercises %}
        <form 
            hx-post="/tasks/{{ task.id }}/complete/workout"
            hx-trigger="submit"
            hx-swap="none"
            hx-on::after-request="htmx.trigger(document.body, 'taskUpdated'); this.closest('.modal-overlay').remove()"
        >
            <input type="hidden" name="intensity" value="{{ intensity }}">
            
            <div class="form-group">
                <label for="exercise_id">Exercise</label>
                <select id="exercise_id" name="exercise_id" required>
                    {% for ex in all_exercises %}
                    <option value="{{ ex.id }}" {% if scheduled_exercise and ex.id == scheduled_exercise.id %}selected{% endif %}>
                        {{ ex.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="sets">Sets</label>
                <input type="number" id="sets" name="sets" min="1" value="3" required>
            </div>
            
            <div class="form-group">
                <label for="reps">Reps</label>
                <input type="number" id="reps" name="reps" min="1" value="10" required>
            </div>
            
            <div class="form-group">
                <label for="weight_kg">Weight (kg)</label>
                <input type="number" id="weight_kg" name="weight_kg" min="0" step="0.5" value="0" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Save</button>
                <button type="button" class="btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            </div>
        </form>
        {% else %}
        <p>No exercises available. Please add exercises to the database.</p>
        <button type="button" class="btn-secondary" onclick="this.closest('.modal-overlay').remove()">Close</button>
        {% endif %}
    </div>
</div>
