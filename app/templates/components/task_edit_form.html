<div class="modal-overlay" x-data="{
    submitting: false,
    // `x-data` is an HTML attribute. JSON plus forceescape makes server data
    // safe after the browser decodes the attribute, including apostrophes.
    selectedDays: {{ (recurrence.day_of_week.split(',') if recurrence and recurrence.day_of_week else []) | tojson | forceescape }},
    allowedDays: {{ (task.allowed_days.split(',') if task.allowed_days else []) | tojson | forceescape }},
    selectedTagIds: {{ task_tag_ids | map('string') | list | tojson | forceescape }},
    notificationRows: {{ task.notification_offsets | tojson | forceescape }}.map(offsetToNotificationRow),
    titleDuplicateWarning: false,
    async checkTitleDuplicate() {
        this.titleDuplicateWarning = await fetchTitleDuplicate(this.form.title, {{ task.id | tojson | forceescape }});
    },
    form: {
        type: {{ task.type | tojson | forceescape }},
        title: {{ task.title | tojson | forceescape }},
        notes: {{ (task.notes or '') | tojson | forceescape }},
        estimated_duration: {{ task.estimated_duration if task.estimated_duration is not none else 'null' }},
        importance: {{ task.importance if task.importance is not none else 2 }},
        urgency: {{ task.urgency if task.urgency is not none else 2 }},
        allow_afternoon: {{ 'true' if task.allow_afternoon else 'false' }},
        deadline_at: {{ (task.deadline_at.strftime('%Y-%m-%dT%H:%M') if task.deadline_at else none) | tojson | forceescape }},
        planning_window_days: {{ task.planning_window_days if task.planning_window_days is not none else 'null' }},
        scheduled_at: {{ (task.scheduled_at.strftime('%Y-%m-%dT%H:%M') if task.scheduled_at else none) | tojson | forceescape }},
        prep_duration: {{ task.prep_duration if task.prep_duration is not none else 'null' }},
        scheduled_time: {{ (task.scheduled_time.strftime('%H:%M') if task.scheduled_time else none) | tojson | forceescape }},
        location: {{ (task.location or '') | tojson | forceescape }},
        recurrence: {
            interval_type: {{ (recurrence.interval_type if recurrence else 'daily') | tojson | forceescape }},
            interval_multiple: {{ recurrence.interval_multiple if recurrence else 1 }},
            day_of_week: {{ (recurrence.day_of_week if recurrence and recurrence.day_of_week else none) | tojson | forceescape }},
            day_of_month: {{ (recurrence.day_of_month if recurrence and recurrence.day_of_month else none) | tojson | forceescape }},
            month_of_year: {{ (recurrence.month_of_year if recurrence and recurrence.month_of_year else none) | tojson | forceescape }},
            start_date: {{ (recurrence.start_date.strftime('%Y-%m-%d') if recurrence and recurrence.start_date else none) | tojson | forceescape }} || todayIsoDate(),
            end_date: {{ (recurrence.end_date.strftime('%Y-%m-%d') if recurrence and recurrence.end_date else none) | tojson | forceescape }}
        }
    },
    showUrgency() {
        return ['errand', 'recurring', 'variable_recurring', 'workout'].includes(this.form.type);
    },
    showAllowAfternoon() {
        return ['errand', 'recurring', 'variable_recurring', 'workout'].includes(this.form.type);
    },
    addNotificationRow() {
        this.notificationRows.push({ mode: 'before', amount: 15, unit: 'minutes' });
    },
    removeNotificationRow(index) {
        this.notificationRows.splice(index, 1);
    },
    closeModal() {
        this.$root.remove();
    },
    async submitForm() {
        this.submitting = true;
        const payload = {
            type: this.form.type,
            title: this.form.title,
            notes: this.form.notes || null,
            estimated_duration: this.form.estimated_duration,
            importance: this.form.importance,
            allow_afternoon: this.form.allow_afternoon,
            tag_ids: this.selectedTagIds.map(Number)
        };
        if (this.showUrgency()) {
            payload.urgency = this.form.urgency;
        }
        if (this.form.type === 'appointment') {
            payload.scheduled_at = this.form.scheduled_at;
            payload.prep_duration = this.form.prep_duration;
            payload.location = this.form.location || null;
        }
        if (['appointment', 'deadline'].includes(this.form.type)) {
            payload.notification_offsets = this.notificationRows.map(notificationRowToOffset);
        }
        if (['deadline', 'errand'].includes(this.form.type)) {
            payload.planning_window_days = this.form.planning_window_days;
        }
        if (this.form.type === 'deadline') {
            payload.deadline_at = this.form.deadline_at;
        }
        if (this.form.type === 'recurring' || this.form.type === 'workout') {
            payload.recurrence = {
                interval_type: this.form.recurrence.interval_type,
                interval_multiple: this.form.recurrence.interval_multiple || 1
            };
            if (this.form.recurrence.interval_type === 'weekly' && this.selectedDays.length > 0) {
                payload.recurrence.day_of_week = this.selectedDays.sort().join(',');
            }
            if (this.form.recurrence.interval_type === 'monthly' && this.form.recurrence.day_of_month) {
                payload.recurrence.day_of_month = this.form.recurrence.day_of_month;
            }
            if (this.form.recurrence.interval_type === 'yearly' && this.form.recurrence.month_of_year) {
                payload.recurrence.month_of_year = this.form.recurrence.month_of_year;
            }
            if (this.form.recurrence.start_date) {
                payload.recurrence.start_date = this.form.recurrence.start_date + 'T00:00:00';
            }
            if (this.form.recurrence.end_date) {
                payload.recurrence.end_date = this.form.recurrence.end_date + 'T00:00:00';
            }
            if (this.form.scheduled_time) {
                payload.scheduled_time = this.form.scheduled_time;
            }
        }
        if (this.form.type === 'variable_recurring') {
            payload.recurrence = {
                interval_type: 'daily',
                interval_multiple: this.form.recurrence.interval_multiple || 7,
            };
            if (this.form.recurrence.start_date) {
                payload.recurrence.start_date = this.form.recurrence.start_date + 'T00:00:00';
            }
            if (this.allowedDays.length > 0) {
                payload.allowed_days = this.allowedDays.sort().join(',');
            }
        }
        try {
            const response = await fetch('/tasks/{{ task.id }}', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) {
                const logId = response.headers.get('X-Undo-Log-Id');
                this.closeModal();
                htmx.trigger(document.body, 'taskUpdated');
                if (logId) showUndoToast(parseInt(logId), `'${this.form.title}' edited`);
            } else {
                const error = await response.json();
                alert('Error updating task: ' + (error.detail || 'Unknown error'));
            }
        } catch (err) {
            alert('Error updating task: ' + err.message);
        } finally {
            this.submitting = false;
        }
    }
}" @click.self="closeModal()">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Task</h2>
            <button class="modal-close" @click="closeModal()">&times;</button>
        </div>
        
        <form @submit.prevent="submitForm()" class="task-form">
            {% set useFormNames = false %}
            {% include "components/_task_form_fields.html" %}

            <div class="form-actions">
                <button type="button" class="btn-cancel" @click="closeModal()">Cancel</button>
                <button type="submit" class="btn-submit" :disabled="submitting">
                    <span x-show="!submitting">Update Task</span>
                    <span x-show="submitting">Updating...</span>
                </button>
            </div>
        </form>
    </div>
</div>
